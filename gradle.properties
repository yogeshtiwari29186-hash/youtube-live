# Gradle and Android build settings
# AGP 9 built-in Kotlin rejects generated KSP source directories through Kotlin sourceSets.
# KSP currently registers these directories; allow the compatibility path until KSP/AGP integration is updated.
android.disallowKotlinSourceSets=false
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
